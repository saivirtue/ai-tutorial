<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>跟讀小鸚鵡</title>
  <link rel="stylesheet" href="../../shared/style.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      overflow: auto;
      gap: 14px;
    }

    #title {
      font-size: clamp(24px, 4vw, 40px);
      font-weight: bold;
      text-shadow: 0 3px 0 rgba(0, 0, 0, 0.35);
    }

    /* ===== 題目：大注音符號＋提示字＋重聽 ===== */
    #card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 18px 50px;
    }

    #symbol {
      font-size: clamp(64px, 15vh, 120px);
      line-height: 1.1;
      font-weight: bold;
      letter-spacing: 0.05em;
    }

    /* ===== 拆解：一個一個注音符號分開顯示，方便指著教拼讀 ===== */
    #breakdown {
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    #breakdown .chip {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 4px 12px;
      font-size: clamp(24px, 5vh, 36px);
    }

    #hint {
      font-size: clamp(26px, 5vh, 38px);
      color: rgba(255, 255, 255, 0.85);
      font-weight: bold;
    }

    #replay-btn {
      font-size: 22px;
      padding: 10px 20px;
      margin-top: 6px;
    }

    /* ===== 麥克風按鈕 ===== */
    #mic-btn {
      font-size: 32px;
      padding: 20px 40px;
    }

    #mic-btn.listening {
      background: var(--bad);
      animation: star-pop 0.6s ease infinite alternate;
    }

    #message {
      font-size: 22px;
      min-height: 2.6em;
      font-weight: bold;
      color: var(--star);
      text-align: center;
      max-width: 90vw;
    }

    #fallback-btn {
      font-size: 16px;
      padding: 8px 16px;
      background: transparent;
      border: 2px dashed rgba(255, 255, 255, 0.5);
      color: rgba(255, 255, 255, 0.8);
    }

    /* .big-btn 的 display:inline-block 特異度比瀏覽器內建的 [hidden] 規則高，
       要在這裡明講一次，不然 hidden 屬性沒有用，按鈕會一直顯示 */
    #fallback-btn[hidden] {
      display: none;
    }

    #stars {
      font-size: clamp(24px, 5vw, 34px);
    }

    .home-link {
      color: rgba(255, 255, 255, 0.7);
      font-size: 18px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div id="title">🦜 跟讀小鸚鵡</div>
  <div id="stars"></div>

  <div id="card">
    <div id="symbol"></div>
    <div id="breakdown"></div>
    <div id="hint"></div>
    <button id="replay-btn" class="big-btn blue" onclick="playDemo()">🔁 再聽一次</button>
  </div>

  <button id="mic-btn" class="big-btn green" onclick="startListening()">🎤 換你說說看！</button>
  <div id="message">聽完範例，按麥克風跟著唸唸看！</div>
  <button id="fallback-btn" class="big-btn" onclick="selfConfirm()" hidden>🙋 麥克風用不了？點這裡直接算過關</button>

  <a class="home-link" href="../../">⬅ 回遊戲樂園</a>

  <script src="../../shared/game-utils.js"></script>
  <script src="../../shared/speech.js"></script>
  <script src="../../shared/stickers.js"></script>
  <script src="../../shared/vision-client.js"></script>
  <script>
    /* ===== 詞庫 =====
       每個字是「一個完整音節」（聲符＋韻符＋聲調），不是單一注音符號——
       完整音節才是正常說話會講的真實讀音，Google 語音辨識起來準得多。
       建議玩法：爸媽先照 zhuyin 一個一個符號帶著唸，教小孩怎麼拼，
       拼熟了再按麥克風讓小孩自己講一次完整的音。
       hanzi：國字本身（範例發音、答對顯示都用這個）
       zhuyin：完整注音拼法（大字顯示，也會拆成一個一個符號給爸媽指）
       pinyin：漢語拼音，顯示在國字旁邊
       accepted：語音辨識聽到這些字（或包含這些字）都算對
       這份對照表是常見一年級單字，實際玩起來覺得太嚴/太鬆都可以照樣子調整。 */
    const WORDS = [
      { hanzi: "你", zhuyin: "ㄋㄧˇ", pinyin: "nǐ", accepted: ["你", "妳"] },
      { hanzi: "好", zhuyin: "ㄏㄠˇ", pinyin: "hǎo", accepted: ["好", "郝"] },
      { hanzi: "媽", zhuyin: "ㄇㄚ", pinyin: "mā", accepted: ["媽"] },
      { hanzi: "爸", zhuyin: "ㄅㄚˋ", pinyin: "bà", accepted: ["爸", "霸", "壩"] },
      { hanzi: "貓", zhuyin: "ㄇㄠ", pinyin: "māo", accepted: ["貓", "錨"] },
      { hanzi: "狗", zhuyin: "ㄍㄡˇ", pinyin: "gǒu", accepted: ["狗", "苟"] },
      { hanzi: "水", zhuyin: "ㄕㄨㄟˇ", pinyin: "shuǐ", accepted: ["水"] },
      { hanzi: "花", zhuyin: "ㄏㄨㄚ", pinyin: "huā", accepted: ["花"] },
      { hanzi: "魚", zhuyin: "ㄩˊ", pinyin: "yú", accepted: ["魚", "漁", "餘"] },
      { hanzi: "月", zhuyin: "ㄩㄝˋ", pinyin: "yuè", accepted: ["月", "越", "閱"] },
      { hanzi: "大", zhuyin: "ㄉㄚˋ", pinyin: "dà", accepted: ["大", "達"] },
      { hanzi: "小", zhuyin: "ㄒㄧㄠˇ", pinyin: "xiǎo", accepted: ["小", "曉"] },
      { hanzi: "天", zhuyin: "ㄊㄧㄢ", pinyin: "tiān", accepted: ["天", "添"] },
      { hanzi: "地", zhuyin: "ㄉㄧˋ", pinyin: "dì", accepted: ["地", "弟", "第"] },
      { hanzi: "山", zhuyin: "ㄕㄢ", pinyin: "shān", accepted: ["山", "衫", "珊"] },
      { hanzi: "火", zhuyin: "ㄏㄨㄛˇ", pinyin: "huǒ", accepted: ["火", "夥"] },
      { hanzi: "風", zhuyin: "ㄈㄥ", pinyin: "fēng", accepted: ["風", "封", "蜂"] },
      { hanzi: "雨", zhuyin: "ㄩˇ", pinyin: "yǔ", accepted: ["雨", "羽", "與"] },
      { hanzi: "手", zhuyin: "ㄕㄡˇ", pinyin: "shǒu", accepted: ["手", "首", "守"] },
      { hanzi: "心", zhuyin: "ㄒㄧㄣ", pinyin: "xīn", accepted: ["心", "新", "辛", "欣"] },
      { hanzi: "眼", zhuyin: "ㄧㄢˇ", pinyin: "yǎn", accepted: ["眼", "演", "掩"] },
      { hanzi: "口", zhuyin: "ㄎㄡˇ", pinyin: "kǒu", accepted: ["口"] },
      { hanzi: "耳", zhuyin: "ㄦˇ", pinyin: "ěr", accepted: ["耳", "爾"] },
      { hanzi: "家", zhuyin: "ㄐㄧㄚ", pinyin: "jiā", accepted: ["家", "加", "佳", "嘉"] },
    ];

    const ROUNDS_TO_WIN = 8;

    let deck = shuffle(WORDS);
    let current = null;
    let stars = 0;
    let listening = false;
    let sessionFallback = false;   // 麥克風壞掉之後，永久顯示自行判斷的按鈕

    const symbolEl = document.getElementById("symbol");
    const breakdownEl = document.getElementById("breakdown");
    const hintEl = document.getElementById("hint");
    const messageEl = document.getElementById("message");
    const micBtn = document.getElementById("mic-btn");
    const fallbackBtn = document.getElementById("fallback-btn");
    const setStars = createStarBar(document.getElementById("stars"), ROUNDS_TO_WIN);

    function playDemo() {
      if (current) say(current.hanzi);
    }

    function nextQuestion() {
      if (deck.length === 0) deck = shuffle(WORDS);
      current = deck.pop();

      symbolEl.textContent = current.zhuyin;
      symbolEl.dataset.answer = current.hanzi;   // 測試用：正解放這裡

      // 把完整拼音拆成一個一個符號，方便爸媽指著教怎麼拼
      breakdownEl.innerHTML = "";
      [...current.zhuyin].forEach((mark) => {
        const chip = document.createElement("span");
        chip.className = "chip";
        chip.textContent = mark;
        breakdownEl.appendChild(chip);
      });

      hintEl.textContent = `${current.hanzi}（${current.pinyin}）`;
      messageEl.textContent = "聽完範例，把注音拼起來，說說看！";
      playDemo();
    }

    /* ===== 跟讀 ===== */

    function startListening() {
      if (listening) return;
      listening = true;
      micBtn.classList.add("listening");
      micBtn.textContent = "🎧 聽你說...";
      messageEl.textContent = `說說看「${current.hanzi}」（${current.zhuyin}）！`;

      listenForSpeech(({ text, error }) => {
        listening = false;
        micBtn.classList.remove("listening");
        micBtn.textContent = "🎤 換你說說看！";

        if (error === "no_server" || error === "mic_disabled" || error === "server_error") {
          fallbackBtn.hidden = false;
          sessionFallback = true;
          messageEl.textContent = "這台伺服器的麥克風還沒開，可以先用下面的按鈕直接算過關！";
          return;
        }

        if (text && current.accepted.some((word) => text.includes(word))) {
          correct();
        } else {
          encourage();
          messageEl.textContent = text ? `我聽到的是「${text}」，再說一次看看！` : "沒聽清楚，再說一次！";
        }
      });
    }

    // 麥克風壞掉時的救援按鈕：爸媽用耳朵判斷後手動算過關
    function selfConfirm() {
      correct();
    }

    function correct() {
      playSound("pop");
      cheer();
      stars++;
      setStars(stars);
      messageEl.textContent = `「${current.hanzi}」說得真好！`;

      setTimeout(() => {
        if (stars >= ROUNDS_TO_WIN) {
          finishRound();
        } else {
          nextQuestion();
        }
      }, 900);
    }

    function finishRound() {
      const sticker = awardSticker();
      awardTrophy("zhuyin-speak-full");
      say("太厲害了！你得到一張新貼紙！");
      notifyMilestone();   // 通知伺服器：讓 SwitchBot 按一下實體按鈕！
      celebrate(`🎉 全部唸對！得到貼紙 ${sticker}`, "再玩一輪", () => {
        stars = 0;
        setStars(0);
        nextQuestion();
      });
    }

    createSpeechToggle();
    setStars(0);
    nextQuestion();
  </script>
</body>
</html>
