<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, target-densitydpi=device-dpi">
  <title>ABC 字母小火車</title>
  <link rel="stylesheet" href="../../shared/style.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      overflow: auto;
      gap: 10px;
    }

    #title {
      font-size: clamp(24px, 4vw, 40px);
      font-weight: bold;
      text-shadow: 0 3px 0 rgba(0, 0, 0, 0.35);
    }

    /* ===== 題目：大圖＋英文單字＋重聽 ===== */
    #card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 18px 40px;
    }

    #picture {
      font-size: clamp(80px, 16vh, 150px);
      line-height: 1.1;
    }

    #word {
      font-size: clamp(28px, 5vh, 44px);
      font-weight: bold;
    }

    #replay-btn {
      font-size: 22px;
      padding: 10px 20px;
    }

    /* ===== 字母選項 ===== */
    #choices {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
    }

    #choices .big-btn {
      font-size: clamp(38px, 7vh, 56px);
      width: clamp(80px, 20vw, 120px);
      padding: 12px 0;
    }

    #message {
      font-size: 22px;
      min-height: 1.4em;
      font-weight: bold;
      color: var(--star);
    }

    /* ===== 火車 ===== */
    #train {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      font-size: clamp(30px, 6vw, 52px);
      filter: drop-shadow(0 3px 0 rgba(0, 0, 0, 0.3));
    }

    .wagon {
      background: rgba(255, 255, 255, 0.15);
      border: 2px dashed rgba(255, 255, 255, 0.4);
      border-radius: 10px;
      width: 1.4em;
      height: 1.3em;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wagon.full {
      background: #a0522d;
      border: none;
      animation: star-pop 0.4s ease;
    }

    #engine {
      transform: scaleX(-1);   /* 火車頭朝右 */
    }

    .home-link {
      color: rgba(255, 255, 255, 0.7);
      font-size: 18px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div id="title">🚂 ABC 字母小火車</div>

  <div id="card">
    <div id="picture"></div>
    <div id="word"></div>
    <button id="replay-btn" class="big-btn blue" onclick="sayWord()">🔁 再聽一次</button>
  </div>

  <div id="message">它的英文開頭是哪個字母呢？</div>
  <div id="choices"></div>

  <div id="train"><span id="engine">🚂</span></div>
  <a class="home-link" href="../../">⬅ 回遊戲樂園</a>

  <script src="../../shared/game-utils.js"></script>
  <script src="../../shared/speech.js"></script>
  <script src="../../shared/stickers.js"></script>
  <script src="../../shared/vision-client.js"></script>
  <script>
    /* 最外層變數用 var，不要用 let/const——某些電視盒的 WebView 對
       「最外層 let/const」有相容性 bug（函式讀不到），var 沒有這個
       問題。函式內部的 let/const 不受影響，不用改。 */

    /* ===== 詞庫 =====
       每個字：圖案、英文單字、中文提示、開頭字母（大寫）
       想跟小孩一起加新的字？照樣子加一行就可以了！ */
    var WORDS = [
      { emoji: "🍎", word: "Apple",    hint: "蘋果", letter: "A" },
      { emoji: "✈️", word: "Airplane", hint: "飛機", letter: "A" },
      { emoji: "🐝", word: "Bee",      hint: "蜜蜂", letter: "B" },
      { emoji: "⚽", word: "Ball",     hint: "球",   letter: "B" },
      { emoji: "🐱", word: "Cat",      hint: "貓",   letter: "C" },
      { emoji: "🚗", word: "Car",      hint: "汽車", letter: "C" },
      { emoji: "🐶", word: "Dog",      hint: "狗",   letter: "D" },
      { emoji: "🦆", word: "Duck",     hint: "鴨子", letter: "D" },
      { emoji: "🐘", word: "Elephant", hint: "大象", letter: "E" },
      { emoji: "🥚", word: "Egg",      hint: "蛋",   letter: "E" },
      { emoji: "🐟", word: "Fish",     hint: "魚",   letter: "F" },
      { emoji: "🐸", word: "Frog",     hint: "青蛙", letter: "F" },
      { emoji: "🍇", word: "Grapes",   hint: "葡萄", letter: "G" },
      { emoji: "🐐", word: "Goat",     hint: "山羊", letter: "G" },
      { emoji: "🎩", word: "Hat",      hint: "帽子", letter: "H" },
      { emoji: "🏠", word: "House",    hint: "房子", letter: "H" },
      { emoji: "🍦", word: "Ice cream", hint: "冰淇淋", letter: "I" },
      { emoji: "🧃", word: "Juice",    hint: "果汁", letter: "J" },
      { emoji: "🪁", word: "Kite",     hint: "風箏", letter: "K" },
      { emoji: "🦁", word: "Lion",     hint: "獅子", letter: "L" },
      { emoji: "🐵", word: "Monkey",   hint: "猴子", letter: "M" },
      { emoji: "🌙", word: "Moon",     hint: "月亮", letter: "M" },
      { emoji: "👃", word: "Nose",     hint: "鼻子", letter: "N" },
      { emoji: "🐙", word: "Octopus",  hint: "章魚", letter: "O" },
      { emoji: "🐷", word: "Pig",      hint: "豬",   letter: "P" },
      { emoji: "👸", word: "Queen",    hint: "皇后", letter: "Q" },
      { emoji: "🐰", word: "Rabbit",   hint: "兔子", letter: "R" },
      { emoji: "☀️", word: "Sun",      hint: "太陽", letter: "S" },
      { emoji: "☂️", word: "Umbrella", hint: "雨傘", letter: "U" },
      { emoji: "🚐", word: "Van",      hint: "廂型車", letter: "V" },
      { emoji: "🐺", word: "Wolf",     hint: "狼",   letter: "W" },
      { emoji: "⭐", word: "Star",     hint: "星星", letter: "S" },
      { emoji: "🐧", word: "Penguin",  hint: "企鵝", letter: "P" },
      { emoji: "🦓", word: "Zebra",    hint: "斑馬", letter: "Z" },
      { emoji: "🍋", word: "Lemon",    hint: "檸檬", letter: "L" },
      { emoji: "🥕", word: "Carrot",   hint: "紅蘿蔔", letter: "C" },
      { emoji: "🐦", word: "Bird",     hint: "小鳥", letter: "B" },
      { emoji: "🦒", word: "Giraffe",  hint: "長頸鹿", letter: "G" },
      { emoji: "🐢", word: "Tortoise", hint: "陸龜", letter: "T" },
    ];

    var TRAIN_SIZE = 8;        // 裝滿幾節車廂算一輪
    var CHOICE_COUNT = 4;      // 一次給幾個字母選

    // 詞庫裡出現過的所有字母（拿來當錯誤選項）
    var ALL_LETTERS = [...new Set(WORDS.map((w) => w.letter))];

    var deck = shuffle(WORDS);   // 洗牌後照順序出題，不會一直重複
    var current = null;
    var loaded = 0;              // 車上有幾隻了
    var locked = false;

    var pictureEl = document.getElementById("picture");
    var wordEl = document.getElementById("word");
    var choicesEl = document.getElementById("choices");
    var messageEl = document.getElementById("message");
    var trainEl = document.getElementById("train");

    /* ===== 火車 ===== */

    function drawTrain() {
      trainEl.innerHTML = '<span id="engine">🚂</span>';
      for (let i = 0; i < TRAIN_SIZE; i++) {
        const wagon = document.createElement("span");
        wagon.className = "wagon";
        trainEl.appendChild(wagon);
      }
    }

    function loadWagon(emoji) {
      const wagon = trainEl.querySelectorAll(".wagon:not(.full)")[0];
      wagon.classList.add("full");
      wagon.textContent = emoji;
    }

    /* ===== 出題 ===== */

    function sayWord() {
      if (current) sayEnglish(`${current.word}! ${current.letter}, ${current.word}!`);
    }

    function nextQuestion() {
      if (deck.length === 0) deck = shuffle(WORDS);
      current = deck.pop();

      pictureEl.textContent = current.emoji;
      pictureEl.dataset.letter = current.letter;   // 測試用：正解放這裡
      wordEl.textContent = `${current.word}（${current.hint}）`;
      messageEl.textContent = "開頭是哪個字母呢？";

      // 正解 + 3 個不一樣的字母，打亂順序
      const wrongs = shuffle(ALL_LETTERS.filter((l) => l !== current.letter)).slice(0, CHOICE_COUNT - 1);
      choicesEl.innerHTML = "";
      shuffle([current.letter, ...wrongs]).forEach((letter) => {
        const btn = document.createElement("button");
        btn.className = "big-btn";
        btn.textContent = letter;
        btn.onclick = () => pick(letter, btn);
        choicesEl.appendChild(btn);
      });

      sayWord();
    }

    /* ===== 作答 ===== */

    function pick(letter, btn) {
      if (locked) return;

      if (letter === current.letter) {
        locked = true;
        playSound("pop");
        cheer();
        loadWagon(current.emoji);
        loaded++;
        messageEl.textContent = `${current.word}（${current.letter}）上車囉！`;

        setTimeout(() => {
          locked = false;
          if (loaded >= TRAIN_SIZE) {
            trainFull();
          } else {
            nextQuestion();
          }
        }, 1100);
      } else {
        playSound("wrong");
        encourage();
        btn.classList.add("shake");
        setTimeout(() => btn.classList.remove("shake"), 450);
        setTimeout(sayWord, 900);   // 再唸一次給他聽
      }
    }

    function trainFull() {
      const sticker = awardSticker();
      awardTrophy("abc-full");
      const msg = `🎉 滿載出發！得到貼紙 ${sticker}`;
      say(`火車滿載出發囉！你得到一張新貼紙！`);
      notifyMilestone();   // 通知伺服器：讓 SwitchBot 按一下實體按鈕！
      celebrate(msg, "再玩一輪", () => {
        loaded = 0;
        drawTrain();
        nextQuestion();
      });
    }

    createSpeechToggle();
    drawTrain();
    nextQuestion();
  </script>
</body>
</html>
