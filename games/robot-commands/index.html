<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, target-densitydpi=device-dpi">
  <title>指令小機器人</title>
  <link rel="stylesheet" href="../../shared/style.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 12px;
      overflow: auto;
    }

    #title {
      font-size: clamp(24px, 4vw, 40px);
      font-weight: bold;
      text-shadow: 0 3px 0 rgba(0, 0, 0, 0.35);
    }

    #playfield {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      align-items: center;
      justify-content: center;
    }

    /* ===== 5x5 地圖 ===== */
    /* 寬高由 JS 依每一關的地圖算出來（地圖大小、形狀每關不同） */
    #grid {
      position: relative;
      display: grid;
      background: #244a2c;
      border-radius: 16px;
      padding: 6px;
      gap: 6px;
      box-shadow: 0 8px 0 rgba(0, 0, 0, 0.3);
    }

    .cell {
      background: #3e7a49;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: inherit;   /* 大小跟著 #grid 走（由 JS 依地圖大小算） */
    }

    /* 這一格沒有地板——地圖就不會是方方正正的一塊 */
    .cell.void {
      background: transparent;
    }

    /* 機器人蓋在格子上面，用 transform 移動才有滑順的動畫 */
    #robot {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: inherit;   /* 跟格子一樣大 */
      transition: transform 0.45s ease;
      z-index: 5;
      pointer-events: none;
    }

    /* ===== 指令區 ===== */
    #controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: min(94vw, 480px);
    }

    #queue {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      align-content: flex-start;
      min-height: 56px;
      width: 100%;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 16px;
      padding: 8px;
    }

    #queue .hint {
      color: rgba(255, 255, 255, 0.6);
      font-size: 18px;
      align-self: center;
      margin: auto;
    }

    .cmd-chip {
      position: relative;
      font-size: 36px;
      background: #fff;
      border-radius: 12px;
      padding: 8px 14px;
      cursor: pointer;
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.25);
    }

    /* 指令方塊右上角的小 ✕，提示「點一下可以刪掉」 */
    .cmd-chip .x {
      position: absolute;
      top: -6px;
      right: -6px;
      background: var(--bad);
      color: #fff;
      font-size: 14px;
      font-weight: bold;
      border-radius: 999px;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cmd-chip.running {
      background: var(--star);
      transform: scale(1.15);
    }

    .cmd-buttons, .action-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .cmd-buttons .big-btn {
      font-size: 34px;
      padding: 12px 22px;
    }

    /* 有連上鏡頭時才出現的提示條 */
    #hand-bar {
      font-size: 16px;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 999px;
      padding: 6px 16px;
      color: var(--star);
      text-align: center;
    }

    #hand-bar[hidden] { display: none; }

    #message {
      font-size: 22px;
      min-height: 1.4em;
      font-weight: bold;
      color: var(--star);
      text-align: center;
    }

    .home-link {
      color: rgba(255, 255, 255, 0.7);
      font-size: 18px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div id="title">🤖 指令小機器人</div>
  <div id="hand-bar" hidden>🖐️ 鏡頭開著！朝上下左右揮手排指令，手往前揮＝執行</div>
  <div id="message"></div>

  <div id="playfield">
    <div id="grid"></div>

    <div id="controls">
      <!-- 排好的指令會出現在這裡，點一下可以拿掉 -->
      <div id="queue"></div>

      <div class="cmd-buttons">
        <button class="big-btn blue" onclick="addCommand('up')">⬆️</button>
        <button class="big-btn blue" onclick="addCommand('down')">⬇️</button>
        <button class="big-btn blue" onclick="addCommand('left')">⬅️</button>
        <button class="big-btn blue" onclick="addCommand('right')">➡️</button>
      </div>

      <div class="action-buttons">
        <button class="big-btn green" id="run-btn" onclick="runProgram()">▶️ 執行！</button>
        <button class="big-btn blue" onclick="undoCommand()">⌫ 退一步</button>
        <button class="big-btn gray" onclick="clearQueue()">🗑️ 全部清除</button>
      </div>

      <a class="home-link" href="../../">⬅ 回遊戲樂園</a>
    </div>
  </div>

  <script src="../../shared/game-utils.js"></script>
  <script src="../../shared/speech.js"></script>
  <script src="../../shared/stickers.js"></script>
  <script src="../../shared/vision-client.js"></script>
  <script>
    /* 最外層變數用 var，不要用 let/const——某些電視盒的 WebView 對
       「最外層 let/const」有相容性 bug（函式讀不到），var 沒有這個
       問題。函式內部的 let/const 不受影響，不用改。 */

    /* ===== 關卡設計 =====
       每一關直接用一張「地圖」畫出來，一個字元一格，看得懂就改得動：
         .  可以走的路
         #  石頭（撞到會失敗）
         (空白)  這裡沒有地板（地圖不一定是方的！）
         S  機器人的起點
         G  寶物
       想跟小孩一起設計新關卡？複製一段照樣子改，或是讓他在紙上畫好
       再打進來——這是這個遊戲最好玩的部分。
       每一關的地圖可以不一樣大、不一定是正方形。 */
    var LEVELS = [
      {
        name: "第 1 關：往前走！",
        map: [
          ".....",
          ".....",
          "S...G",
          ".....",
          ".....",
        ],
      },
      {
        name: "第 2 關：轉個彎",
        map: [
          ".....",
          "..G..",
          ".....",
          ".....",
          "S....",
        ],
      },
      {
        name: "第 3 關：小心石頭！",
        map: [
          ".....",
          ".....",
          "S.#.G",
          ".....",
          ".....",
        ],
      },
      {
        name: "第 4 關：繞過去",
        map: [
          "S....",
          ".#...",
          ".....",
          ".#.G.",
          ".....",
        ],
      },
      {
        name: "第 5 關：走廊",
        map: [
          "S.###",
          ".#...",
          "...#.",
          "##.#.",
          "....G",
        ],
      },
      {
        name: "第 6 關：十字路口",
        map: [
          "  S  ",
          "  .  ",
          ".....",
          "  .  ",
          "  G  ",
        ],
      },
      {
        name: "第 7 關：ㄇ 字型",
        map: [
          "S.. ..G",
          ".#. .#.",
          ".#. .#.",
          ".#...#.",
          ".......",
        ],
      },
      {
        name: "第 8 關：大迷宮！",
        map: [
          "S.#....",
          ".#.##.#",
          ".....#.",
          "##.#...",
          "...#.#.",
          ".#...#.",
          ".#.##.G",
        ],
      },
    ];

    // 地圖上的字元代表什麼
    var TILE_PATH = ".";
    var TILE_ROCK = "#";
    var TILE_VOID = " ";
    var MAX_COMMANDS = 30;                 // 指令最多排幾個（後面的迷宮要走很多步）
    var CMD_ICONS = { up: "⬆️", down: "⬇️", left: "⬅️", right: "➡️" };
    // 每個指令會讓 x 和 y 怎麼變（y 往下是加）
    var MOVES = {
      up:    { x: 0, y: -1 },
      down:  { x: 0, y: 1 },
      left:  { x: -1, y: 0 },
      right: { x: 1, y: 0 },
    };

    /* ===== 遊戲狀態 ===== */
    var levelIndex = 0;
    var robot = { x: 0, y: 0 };            // 機器人現在的位置
    var queue = [];                        // 排好的指令，例如 ["forward", "left"]
    var running = false;                   // 正在執行中就不能亂按

    var gridEl = document.getElementById("grid");
    var queueEl = document.getElementById("queue");
    var messageEl = document.getElementById("message");
    var robotEl = null;

    /* ===== 讀地圖 ===== */

    function currentLevel() {
      return LEVELS[levelIndex];
    }

    // 這一關的地圖幾格寬、幾格高（每一關可以不一樣大）
    function mapSize() {
      const map = currentLevel().map;
      let width = 0;
      for (let i = 0; i < map.length; i++) width = Math.max(width, map[i].length);
      return { width: width, height: map.length };
    }

    // 拿地圖上某一格的字元；超出範圍就當作「沒有地板」
    function tileAt(x, y) {
      const map = currentLevel().map;
      if (y < 0 || y >= map.length) return TILE_VOID;
      const row = map[y];
      if (x < 0 || x >= row.length) return TILE_VOID;
      return row[x];
    }

    // 找地圖上的某個記號（S 起點、G 寶物）在哪一格
    function findTile(mark) {
      const map = currentLevel().map;
      for (let y = 0; y < map.length; y++) {
        const x = map[y].indexOf(mark);
        if (x >= 0) return { x: x, y: y };
      }
      return { x: 0, y: 0 };
    }

    // 這一格可以站嗎？石頭和「沒有地板」都不行
    function canStand(x, y) {
      const tile = tileAt(x, y);
      return tile !== TILE_ROCK && tile !== TILE_VOID;
    }

    /* ===== 畫地圖 ===== */

    /* 地圖每一關大小不同，而且不一定是正方形，所以整張圖的寬高直接
       用算的（不靠 CSS 的 aspect-ratio——舊瀏覽器不支援那個屬性）。
       算出來的格子一定是正方形，而且寬高都不會超出畫面。 */
    function sizeGrid() {
      const size = mapSize();
      const gap = 6;
      const pad = 6;
      const availW = Math.min(document.documentElement.clientWidth * 0.9, 520);
      const availH = window.innerHeight * 0.5;

      const cellFromW = (availW - pad * 2 - gap * (size.width - 1)) / size.width;
      const cellFromH = (availH - pad * 2 - gap * (size.height - 1)) / size.height;
      const cell = Math.max(22, Math.min(cellFromW, cellFromH));

      gridEl.style.width = (cell * size.width + gap * (size.width - 1) + pad * 2) + "px";
      gridEl.style.height = (cell * size.height + gap * (size.height - 1) + pad * 2) + "px";
      gridEl.style.fontSize = Math.floor(cell * 0.62) + "px";
    }

    function drawGrid() {
      const size = mapSize();
      gridEl.innerHTML = "";
      gridEl.style.gridTemplateColumns = `repeat(${size.width}, 1fr)`;
      gridEl.style.gridTemplateRows = `repeat(${size.height}, 1fr)`;
      sizeGrid();

      for (let y = 0; y < size.height; y++) {
        for (let x = 0; x < size.width; x++) {
          const cell = document.createElement("div");
          const tile = tileAt(x, y);
          cell.className = "cell";
          if (tile === TILE_VOID) {
            cell.classList.add("void");        // 沒有地板：畫成空的
          } else if (tile === TILE_ROCK) {
            cell.textContent = "🪨";
          } else if (tile === "G") {
            cell.textContent = "🎁";
          }
          gridEl.appendChild(cell);
        }
      }

      // 機器人另外畫，蓋在格子上面
      robotEl = document.createElement("div");
      robotEl.id = "robot";
      robotEl.textContent = "🤖";
      gridEl.appendChild(robotEl);
      placeRobot();
    }

    // 依 robot 的 x, y 把機器人移到正確的格子上（transform 會自動有滑順動畫）
    function placeRobot() {
      const cell = gridEl.children[0];                    // 用第一格量出格子多大
      const stepX = cell.offsetWidth + 6;                 // 6 是格子間距
      const stepY = cell.offsetHeight + 6;
      robotEl.style.width = cell.offsetWidth + "px";
      robotEl.style.height = cell.offsetHeight + "px";
      robotEl.style.transform = `translate(${6 + robot.x * stepX}px, ${6 + robot.y * stepY}px)`;
    }

    function resetRobot() {
      const s = findTile("S");
      robot = { x: s.x, y: s.y };
      placeRobot();
    }

    /* ===== 指令佇列 ===== */

    function addCommand(cmd) {
      if (running || queue.length >= MAX_COMMANDS) return;
      playSound("click");
      queue.push(cmd);
      drawQueue();
    }

    function removeCommand(index) {
      if (running) return;
      playSound("click");
      queue.splice(index, 1);
      drawQueue();
    }

    // 拿掉最後一個指令。點指令方塊本身也可以刪，但小孩不一定看得出來
    // 可以點，所以另外給一顆明顯的按鈕。
    function undoCommand() {
      if (running || queue.length === 0) return;
      removeCommand(queue.length - 1);
    }

    function clearQueue() {
      if (running) return;
      playSound("click");
      queue = [];
      drawQueue();
    }

    function drawQueue() {
      queueEl.innerHTML = "";
      if (queue.length === 0) {
        queueEl.innerHTML = `<span class="hint">按下面的按鈕排指令 👇</span>`;
        return;
      }
      queue.forEach((cmd, i) => {
        const chip = document.createElement("span");
        chip.className = "cmd-chip";
        // 右上角加一個小 ✕，讓小孩看得出來「點一下可以把這個丟掉」
        chip.innerHTML = `${CMD_ICONS[cmd]}<span class="x">✕</span>`;
        chip.onclick = () => removeCommand(i);
        queueEl.appendChild(chip);
      });
    }

    /* ===== 執行程式（一步一步做） =====
       故意不用 async/await（那是比 ES6 更晚才有的語法，有些舊瀏覽器
       解析不了），改用 setTimeout 一格一格接下去，效果一樣。 */

    function clearRunningHighlight(chips) {
      for (var i = 0; i < chips.length; i++) chips[i].classList.remove("running");
    }

    function runProgram() {
      if (running || queue.length === 0) return;
      running = true;
      messageEl.textContent = "";
      resetRobot();

      setTimeout(function () {
        var chips = queueEl.children;
        var i = 0;

        function step() {
          if (i >= queue.length) {
            // 指令做完了，但還沒走到寶物
            clearRunningHighlight(chips);
            playSound("wrong");
            say("還沒拿到寶物，再加幾個指令試試看！");
            messageEl.textContent = "還沒拿到寶物，再加幾個指令試試看！";
            running = false;
            return;
          }

          // 亮起現在執行到哪一個指令
          clearRunningHighlight(chips);
          chips[i].classList.add("running");

          var ok = doCommand(queue[i]);

          setTimeout(function () {
            if (!ok) {
              // 撞到東西了！回到起點，指令保留，讓小孩修改再試（這就是除錯！）
              playSound("crash");
              say("哎呀，撞到了！改一改指令再試一次！");
              robotEl.classList.add("shake");
              messageEl.textContent = "💥 撞到了！改一改指令再試一次！";
              setTimeout(function () {
                robotEl.classList.remove("shake");
                resetRobot();
                running = false;
              }, 700);
              return;
            }

            // 走到寶物就過關（不用等指令全部做完）
            var goal = findTile("G");
            if (robot.x === goal.x && robot.y === goal.y) {
              clearRunningHighlight(chips);
              running = false;
              levelClear();
              return;
            }

            i++;
            step();
          }, 600);
        }

        step();
      }, 500);
    }

    // 做一個指令；回傳 false 表示撞到石頭或走出地圖外
    function doCommand(cmd) {
      // 先算出下一格在哪
      const move = MOVES[cmd];
      const nextX = robot.x + move.x;
      const nextY = robot.y + move.y;

      if (!canStand(nextX, nextY)) return false;

      robot.x = nextX;
      robot.y = nextY;
      playSound("step");
      placeRobot();
      return true;
    }

    function levelClear() {
      const sticker = awardSticker();
      if (levelIndex === LEVELS.length - 1) {
        awardTrophy("robot-all");
        say("全部破關！你是程式大師！還得到一張新貼紙！");
        notifyMilestone();   // 通知伺服器：讓 SwitchBot 按一下實體按鈕！
        celebrate(`🏆 全部破關！得到貼紙 ${sticker}`, "從頭再玩", () => loadLevel(0));
      } else {
        say(`${randomFrom(CHEERS)}得到貼紙一張！`);
        celebrate(`🎉 過關！得到貼紙 ${sticker}`, "下一關", () => loadLevel(levelIndex + 1));
      }
    }

    function loadLevel(index) {
      levelIndex = index;
      queue = [];
      messageEl.textContent = "";
      document.getElementById("title").textContent = "🤖 " + currentLevel().name;
      say(currentLevel().name + "！帶機器人走到禮物那裡吧！");
      drawGrid();
      resetRobot();
      drawQueue();
    }

    /* ===== 用手玩（沒開鏡頭伺服器就自動跳過，按按鈕玩法完全不變） =====
       這一關的四個方向本來就跟「往哪邊揮手」對得起來，所以手勢用起來
       特別直覺：朝哪邊揮，就排哪個方向的指令；手往前揮＝按下執行。
       這樣小孩可以站遠一點用整隻手臂玩，不用一直靠到螢幕前面點。 */

    var handBar = document.getElementById("hand-bar");

    connectVision({
      onStatus: function (connected) {
        handBar.hidden = !connected;
      },
      onGesture: function (gesture) {
        if (running) return;                    // 機器人正在走，先不要收新指令
        if (gesture.name === "swipe" && MOVES[gesture.dir]) {
          addCommand(gesture.dir);
          messageEl.textContent = `排了一個 ${CMD_ICONS[gesture.dir]}`;
        } else if (gesture.name === "push") {
          runProgram();
        }
      },
    });

    // 轉直/轉橫的時候重新把機器人放到正確位置
    window.addEventListener("resize", function () { sizeGrid(); placeRobot(); });

    refreshStickers();   // 開場先跟伺服器對一下貼紙，免得用到過期的本機資料
    createSpeechToggle();
    loadLevel(0);
  </script>
</body>
</html>
