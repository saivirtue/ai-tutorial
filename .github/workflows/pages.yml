name: Deploy to GitHub Pages

# 推到 main 就自動部署；也可以在 Actions 頁面手動觸發（workflow_dispatch）。
# 只部署純觸控版——鏡頭比手指、跟讀麥克風、SwitchBot 這些功能需要本機
# 的 server/vision_server.py，Pages 是純靜態網站沒辦法跑 Python，所以
# 這些功能在 Pages 版本會自動略過（vision-client.js 連不上伺服器時
# 本來就設計成靜默退回純觸控，遊戲照常能玩）。

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 「更新台股快照」跑完也要重新部署。
  # 為什麼需要這一段：那個工作流程用內建的 GITHUB_TOKEN 把資料 commit 進
  # main，而 GitHub 為了防止無限迴圈，**用 GITHUB_TOKEN 推的 commit 不會
  # 觸發其他工作流程**——所以光靠上面的 push 事件，資料更新後網站不會更新。
  workflow_run:
    workflows: ["更新台股快照"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 被 workflow_run 觸發時，只有前一個工作流程成功才部署；
    # 其他觸發方式（push、手動）不受這個條件影響。
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
        with:
          enablement: true   # 第一次跑會自動啟用 Pages，不用去 Settings 手動點
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
