name: Deploy to GitHub Pages

# 推到 main 就自動部署；也可以在 Actions 頁面手動觸發（workflow_dispatch）。
# 只部署純觸控版——鏡頭比手指、跟讀麥克風、SwitchBot 這些功能需要本機
# 的 server/vision_server.py，Pages 是純靜態網站沒辦法跑 Python，所以
# 這些功能在 Pages 版本會自動略過（vision-client.js 連不上伺服器時
# 本來就設計成靜默退回純觸控，遊戲照常能玩）。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
