name: 台股 API 端點檢查

# 手動觸發專用。用途：不用筆電、不用開瀏覽器，就能確認 stock/ 這一頁
# 用到的四個證交所端點還通不通、CORS 有沒有開、欄位名稱有沒有被改掉。
#
# 怎麼用：Actions 分頁 → 左邊選「台股 API 端點檢查」→ Run workflow
# （分支選哪個都可以）。跑完結果會同時出現在兩個地方：
#   1. job 的 log 裡（純文字，往下捲就看得到）
#   2. run 頁面的 Summary 區塊（排版好的表格，在 job 列表下方）

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 檢查四個端點
        run: |
          BASE="${TWSE_BASE:-https://openapi.twse.com.tw/v1}"
          # 帶上真實的 Origin，才看得出證交所有沒有回 CORS 標頭。
          # 注意：curl 看得到標頭但不會執行同源政策，所以這裡的 CORS 結果
          # 只代表「證交所有沒有給」，瀏覽器實際行為仍要開網頁才算數。
          ORIGIN="https://saivirtue.github.io"

          # 端點｜這一頁拿它做什麼
          # 三大法人買賣超不在這裡——它不是 openapi.twse.com.tw 底下的端點，
          # 回應格式也不是陣列，用同一套檢查邏輯只會顯示誤導的結果。
          # 見下面「驗證三大法人端點」那個獨立步驟。
          ENDPOINTS=(
            "exchangeReport/STOCK_DAY_ALL|收盤價、漲跌、成交量（必要）"
            "exchangeReport/BWIBBU_ALL|本益比、殖利率、股價淨值比"
            "opendata/t187ap05_L|每月營業收入"
          )

          TABLE=$(mktemp)    # 摘要表格
          DETAILS=$(mktemp)  # 每個端點的欄位與範例
          FAILED=0

          {
            echo "## 台股 API 端點檢查"
            echo ""
            echo "檢查時間：$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M') (台北)"
            echo ""
            echo "| 端點 | HTTP | CORS | 筆數 | 用途 |"
            echo "|---|---|---|---|---|"
          } >> "$TABLE"

          for entry in "${ENDPOINTS[@]}"; do
            path="${entry%%|*}"
            purpose="${entry##*|}"

            # 進度即時印到 log，跑很慢的時候才知道卡在哪一個
            echo "→ 正在檢查 $path ..."

            code=$(curl -sS -o /tmp/body.json -D /tmp/head.txt -w '%{http_code}' \
                    -H "Origin: $ORIGIN" -H 'Accept: application/json' \
                    --max-time 60 "$BASE/$path" 2>/dev/null || true)
            code="${code:-000}"

            acao=$(grep -i '^access-control-allow-origin:' /tmp/head.txt \
                    | head -1 | cut -d' ' -f2- | tr -d '\r')
            if [ -n "$acao" ]; then
              cors="OK \`$acao\`"
            else
              cors="無"
            fi

            if [ "$code" = "200" ] && jq -e 'type == "array"' /tmp/body.json >/dev/null 2>&1; then
              count=$(jq 'length' /tmp/body.json)
              status="✅ 200"
              # 欄位取「keys 最多的那一筆」而不是第 0 筆——月營收那個端點的
              # 開頭是只有「出表日期」的雜訊列，取第 0 筆會看不到真正的欄位。
              {
                echo ""
                echo "### \`$path\`"
                echo ""
                echo "實際欄位名稱："
                echo ""
                echo '```'
                jq -r '(max_by(keys|length) // {}) | keys_unsorted | join(" · ")' /tmp/body.json
                echo '```'
                echo ""
                echo "資料範例（取欄位最完整的一筆）："
                echo ""
                echo '```json'
                jq -c '(max_by(keys|length) // {})' /tmp/body.json | head -c 500
                echo ""
                echo '```'
              } >> "$DETAILS"
            else
              count="—"
              if [ "$code" = "200" ]; then status="❌ 200 但非陣列"; else status="❌ $code"; fi
              FAILED=1
              {
                echo ""
                echo "### \`$path\` — 失敗"
                echo ""
                echo "HTTP \`$code\`。回應開頭："
                echo ""
                echo '```'
                head -c 300 /tmp/body.json
                echo ""
                echo '```'
              } >> "$DETAILS"
            fi

            echo "| \`$path\` | $status | $cors | $count | $purpose |" >> "$TABLE"
          done

          {
            echo ""
            if [ "$FAILED" = "0" ]; then
              echo "> ✅ 四個端點都通。"
            else
              echo "> ⚠️ 有端點失敗，看下面的細節。"
            fi
            echo ""
            echo "**CORS 欄位怎麼讀：** 顯示 OK 代表證交所有給跨域授權，stock/ 那一頁不用架 proxy；顯示「無」就需要一個 proxy 中轉。"
            echo ""
            echo "---"
          } >> "$TABLE"

          REPORT=$(mktemp)
          cat "$TABLE" "$DETAILS" > "$REPORT"

          # 寫進 Summary（排版好的表格）
          cat "$REPORT" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

          # 同時印到 log——不然 job 的 log 會是空白的，
          # 還要特地退出 log 檢視才找得到結果。
          echo ""
          echo "=================== 檢查結果 ==================="
          cat "$REPORT"
          echo "================================================"
          echo ""
          echo "（上面這份也在 run 頁面的 Summary 區塊，排版比較好讀）"

          # 這個工作流程是「回報現況」用的，端點掛掉不該讓它顯示成紅色失敗，
          # 不然會跟「工作流程本身壞了」混在一起。結果一律看上面的報告。
          exit 0



      - name: 驗證三大法人端點
        run: |
          # 三大法人買賣超（T86）查證結果：不屬於 openapi.twse.com.tw，是
          # 證交所官網自己的報表 API，回應格式也不同——不是陣列，是
          # {stat, date, fields, data}。這裡直接打確切的網址並驗證格式。
          TAIPEI_DATE=$(TZ=Asia/Taipei date +%Y%m%d)
          URL="https://www.twse.com.tw/rwd/zh/fund/T86?date=${TAIPEI_DATE}&selectType=ALL&response=json"

          echo "查詢日期：$TAIPEI_DATE（台北）"
          echo "網址：$URL"
          echo ""

          code=$(curl -sSL -o /tmp/t86.json -w '%{http_code}' \
                  -A 'Mozilla/5.0 (compatible; stock-data-snapshot/1.0)' \
                  -H 'Accept: application/json' --max-time 60 "$URL" 2>/dev/null || true)
          code="${code:-000}"
          echo "HTTP $code"
          echo ""

          if [ "$code" != "200" ]; then
            echo "❌ 連不到，回應開頭："
            head -c 300 /tmp/t86.json
            exit 0
          fi

          if ! jq -e '.fields and .data' /tmp/t86.json >/dev/null 2>&1; then
            echo "⚠️ HTTP 200，但格式不是預期的 {fields, data}。回應開頭："
            head -c 500 /tmp/t86.json
            exit 0
          fi

          echo "stat: $(jq -r '.stat // "（無）"' /tmp/t86.json)"
          echo "date: $(jq -r '.date // "（無）"' /tmp/t86.json)"
          echo ""
          echo "欄位名稱："
          jq -r '.fields | join(" · ")' /tmp/t86.json
          echo ""

          rows=$(jq '.data | length' /tmp/t86.json)
          echo "資料筆數：$rows"

          if [ "$rows" = "0" ]; then
            echo ""
            echo "⚠️ 筆數是 0——今天可能還沒公布（約傍晚才更新）、或今天不是交易日。"
            echo "   不代表端點壞了，過陣子或換個交易日再測即可。"
            exit 0
          fi

          echo ""
          echo "轉成物件陣列後的第一筆（stock-data.yml 實際會產生的格式）："
          jq -c '[(.data // [])[] | [$__fields, .] | transpose | map({(.[0]): .[1]}) | add] | .[0]' \
            --argjson __fields "$(jq -c '.fields' /tmp/t86.json)" \
            /tmp/t86.json
          exit 0
