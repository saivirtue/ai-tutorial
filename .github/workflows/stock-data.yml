name: 更新台股快照

# 每天收盤後抓一次證交所資料，把 JSON 直接 commit 進 stock/data/。
#
# 為什麼要這樣做：證交所的 OpenAPI 不回 Access-Control-Allow-Origin，
# 瀏覽器沒辦法直接抓（實測四個端點都沒有）。與其另外架一個 proxy 服務，
# 不如利用「資料本來就一天只變一次」這件事——把快照放進 repo，網頁讀
# 同源的靜態檔案，CORS 問題根本不存在，載入也快很多。
#
# 附帶好處：每天的快照會累積在 git 歷史裡，將來要做回測就有資料了。

on:
  schedule:
    # UTC 10:30 = 台北 18:30，週一到週五。挑這個時間是因為三大法人的
    # 資料大約傍晚才會更新完，太早抓會拿到前一天的。
    - cron: '30 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stock-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 抓取快照
        run: |
          BASE="https://openapi.twse.com.tw/v1"
          TAIPEI_DATE=$(TZ=Asia/Taipei date +%Y%m%d)
          mkdir -p stock/data

          META=$(mktemp)
          echo '{' > "$META"
          echo "  \"fetchedAt\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"," >> "$META"
          echo '  "sources": {' >> "$META"
          FIRST=1

          # 把「這個來源拿到的資料」寫進快照或標成過期。所有來源共用同一套
          # 判定：拿到非空陣列才算成功；否則保留既有快照（不用錯誤覆蓋好資料），
          # 完全沒有既有快照才標成 missing。
          record() {
            local key="$1" label="$2" path="$3" tmp="$4" http="$5"
            local n=0 status

            if [ -s "$tmp" ] && jq -e 'type == "array" and length > 0' "$tmp" >/dev/null 2>&1; then
              n=$(jq 'length' "$tmp")
              jq -c '.' "$tmp" > "stock/data/$key.json"
              echo "  ✅ $n 筆，已寫入 stock/data/$key.json"
              status="ok"
            elif [ -f "stock/data/$key.json" ]; then
              n=$(jq 'length' "stock/data/$key.json" 2>/dev/null || echo 0)
              echo "  ⚠️ 沒有取得有效資料（HTTP $http）— 保留既有快照（$n 筆）"
              status="stale"
            else
              echo "  ❌ 沒有取得有效資料（HTTP $http），也沒有既有快照可用"
              status="missing"
            fi

            [ "$FIRST" = "1" ] || echo "," >> "$META"
            FIRST=0
            printf '    "%s": {"label": "%s", "path": "%s", "status": "%s", "count": %s, "http": "%s"}' \
              "$key" "$label" "$path" "$status" "$n" "$http" >> "$META"
          }

          # ===== 三個 openapi.twse.com.tw 端點：回應本來就是陣列 =====
          for entry in \
            "daily|exchangeReport/STOCK_DAY_ALL|個股日成交資訊" \
            "valuation|exchangeReport/BWIBBU_ALL|本益比、殖利率、股價淨值比" \
            "revenue|opendata/t187ap05_L|每月營業收入"
          do
            key="${entry%%|*}"
            rest="${entry#*|}"
            path="${rest%%|*}"
            label="${rest#*|}"

            echo "→ $key ($path)"
            tmp=$(mktemp)
            code=$(curl -sSL -o "$tmp" -w '%{http_code}' \
                    -H 'Accept: application/json' --max-time 120 \
                    "$BASE/$path" 2>/dev/null || true)
            code="${code:-000}"
            record "$key" "$label" "$path" "$tmp" "$code"
          done

          # ===== 三大法人：不在 openapi.twse.com.tw 底下 =====
          # 一開始誤用了 openapi.twse.com.tw/v1/fund/T86，行為時好時壞
          # （時而 302、時而 200 但空、時而 404）。查證後發現這份資料根本
          # 不屬於 OpenAPI，是證交所官網自己的報表 API：
          #   https://www.twse.com.tw/rwd/zh/fund/T86?date=YYYYMMDD&selectType=ALL&response=json
          # 回應格式也不同——不是陣列，是 {stat, date, fields, data}，
          # data 是「跟 fields 對應順序」的二維陣列，要自己轉成物件陣列。
          # 好處是這樣轉出來的物件，key 就是證交所自己回的欄位名稱，
          # 不用像其他端點一樣用猜的。
          echo "→ institution (www.twse.com.tw/rwd/zh/fund/T86)"
          inst_url="https://www.twse.com.tw/rwd/zh/fund/T86?date=${TAIPEI_DATE}&selectType=ALL&response=json"
          inst_raw=$(mktemp)
          inst_code=$(curl -sSL -o "$inst_raw" -w '%{http_code}' \
                        -A 'Mozilla/5.0 (compatible; stock-data-snapshot/1.0)' \
                        -H 'Accept: application/json' --max-time 120 \
                        "$inst_url" 2>/dev/null || true)
          inst_code="${inst_code:-000}"

          inst_tmp=$(mktemp)
          jq '[(.data // [])[] | [$__fields, .] | transpose | map({(.[0]): .[1]}) | add]' \
            --argjson __fields "$(jq -c '.fields // []' "$inst_raw" 2>/dev/null || echo '[]')" \
            "$inst_raw" > "$inst_tmp" 2>/dev/null || echo '[]' > "$inst_tmp"

          record "institution" "三大法人買賣超" "www.twse.com.tw/rwd/zh/fund/T86" "$inst_tmp" "$inst_code"

          echo "" >> "$META"
          echo '  }' >> "$META"
          echo '}' >> "$META"
          jq '.' "$META" > stock/data/meta.json

          echo ""
          echo "=== meta.json ==="
          cat stock/data/meta.json

      - name: 有變更才 commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock/data
          if git diff --cached --quiet; then
            echo "資料沒有變化，不產生 commit"
            exit 0
          fi
          # 只列出檔案大小變化，不要把整包 JSON 塞進 commit message
          SUMMARY=$(cd stock/data && for f in *.json; do
            printf '%s (%s)\n' "$f" "$(jq 'if type=="array" then length else "meta" end' "$f" 2>/dev/null)"
          done)
          git commit -m "更新台股快照 $(TZ=Asia/Taipei date '+%Y-%m-%d')" -m "$SUMMARY"
          git push
