name: 更新台股快照

# 每天收盤後抓一次證交所資料，把 JSON 直接 commit 進 stock/data/。
#
# 為什麼要這樣做：證交所的 OpenAPI 不回 Access-Control-Allow-Origin，
# 瀏覽器沒辦法直接抓（實測四個端點都沒有）。與其另外架一個 proxy 服務，
# 不如利用「資料本來就一天只變一次」這件事——把快照放進 repo，網頁讀
# 同源的靜態檔案，CORS 問題根本不存在，載入也快很多。
#
# 附帶好處：每天的快照會累積在 git 歷史裡，將來要做回測就有資料了。

on:
  schedule:
    # UTC 10:30 = 台北 18:30，週一到週五。挑這個時間是因為三大法人的
    # 資料大約傍晚才會更新完，太早抓會拿到前一天的。
    - cron: '30 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stock-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 抓取快照
        run: |
          BASE="https://openapi.twse.com.tw/v1"
          TAIPEI_DATE=$(TZ=Asia/Taipei date +%Y%m%d)
          mkdir -p stock/data

          META=$(mktemp)
          echo '{' > "$META"
          echo "  \"fetchedAt\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"," >> "$META"
          echo '  "sources": {' >> "$META"
          FIRST=1

          # 把「這個來源拿到的資料」寫進快照或標成過期。所有來源共用同一套
          # 判定：拿到非空陣列才算成功；否則保留既有快照（不用錯誤覆蓋好資料），
          # 完全沒有既有快照才標成 missing。
          record() {
            local key="$1" label="$2" path="$3" tmp="$4" http="$5"
            local n=0 status

            if [ -s "$tmp" ] && jq -e 'type == "array" and length > 0' "$tmp" >/dev/null 2>&1; then
              n=$(jq 'length' "$tmp")
              jq -c '.' "$tmp" > "stock/data/$key.json"
              echo "  ✅ $n 筆，已寫入 stock/data/$key.json"
              status="ok"
            elif [ -f "stock/data/$key.json" ]; then
              n=$(jq 'length' "stock/data/$key.json" 2>/dev/null || echo 0)
              echo "  ⚠️ 沒有取得有效資料（HTTP $http）— 保留既有快照（$n 筆）"
              status="stale"
            else
              echo "  ❌ 沒有取得有效資料（HTTP $http），也沒有既有快照可用"
              status="missing"
            fi

            [ "$FIRST" = "1" ] || echo "," >> "$META"
            FIRST=0
            printf '    "%s": {"label": "%s", "path": "%s", "status": "%s", "count": %s, "http": "%s"}' \
              "$key" "$label" "$path" "$status" "$n" "$http" >> "$META"
          }

          # ===== 五個 openapi.twse.com.tw 端點：回應本來就是陣列 =====
          for entry in \
            "daily|exchangeReport/STOCK_DAY_ALL|個股日成交資訊" \
            "valuation|exchangeReport/BWIBBU_ALL|本益比、殖利率、股價淨值比" \
            "revenue|opendata/t187ap05_L|每月營業收入" \
            "etfRank|ETFReport/ETFRank|定期定額交易戶數排行" \
            "yearRange|exchangeReport/FMNPTK_ALL|個股年成交資訊（今年至今）"
          do
            key="${entry%%|*}"
            rest="${entry#*|}"
            path="${rest%%|*}"
            label="${rest#*|}"

            echo "→ $key ($path)"
            tmp=$(mktemp)
            code=$(curl -sSL -o "$tmp" -w '%{http_code}' \
                    -H 'Accept: application/json' --max-time 120 \
                    "$BASE/$path" 2>/dev/null || true)
            code="${code:-000}"
            record "$key" "$label" "$path" "$tmp" "$code"
          done

          # ===== 三大法人：不在 openapi.twse.com.tw 底下 =====
          # 一開始誤用了 openapi.twse.com.tw/v1/fund/T86，行為時好時壞
          # （時而 302、時而 200 但空、時而 404）。查證後發現這份資料根本
          # 不屬於 OpenAPI，是證交所官網自己的報表 API：
          #   https://www.twse.com.tw/rwd/zh/fund/T86?date=YYYYMMDD&selectType=ALL&response=json
          # 回應格式也不同——不是陣列，是 {stat, date, fields, data}，
          # data 是「跟 fields 對應順序」的二維陣列，要自己轉成物件陣列。
          # 好處是這樣轉出來的物件，key 就是證交所自己回的欄位名稱，
          # 不用像其他端點一樣用猜的。
          echo "→ institution (www.twse.com.tw/rwd/zh/fund/T86)"
          inst_url="https://www.twse.com.tw/rwd/zh/fund/T86?date=${TAIPEI_DATE}&selectType=ALL&response=json"
          inst_raw=$(mktemp)
          inst_code=$(curl -sSL -o "$inst_raw" -w '%{http_code}' \
                        -A 'Mozilla/5.0 (compatible; stock-data-snapshot/1.0)' \
                        -H 'Accept: application/json' --max-time 120 \
                        "$inst_url" 2>/dev/null || true)
          inst_code="${inst_code:-000}"

          inst_tmp=$(mktemp)
          jq '[(.data // [])[] | [$__fields, .] | transpose | map({(.[0]): .[1]}) | add]' \
            --argjson __fields "$(jq -c '.fields // []' "$inst_raw" 2>/dev/null || echo '[]')" \
            "$inst_raw" > "$inst_tmp" 2>/dev/null || echo '[]' > "$inst_tmp"

          record "institution" "三大法人買賣超" "www.twse.com.tw/rwd/zh/fund/T86" "$inst_tmp" "$inst_code"

          echo "" >> "$META"
          echo '  }' >> "$META"
          echo '}' >> "$META"
          jq '.' "$META" > stock/data/meta.json

          echo ""
          echo "=== meta.json ==="
          cat stock/data/meta.json

      - name: 累積全市場估值中位數
        run: |
          # 「大盤本益比」的正規算法要市值加權，市值需要在外流通股數——
          # 免費 API 沒有這個資料，所以不假裝算得出來。改算全市場本益比／
          # 殖利率的「中位數」：只用我們已經在抓的 daily/valuation 兩份
          # 資料，不用新端點、不碰新網域，也就沒有新的 CORS 風險。中位數
          # 比平均數更抗極端值干擾（少數本益比 200 的公司不會把它拉爆）。
          #
          # 每個交易日一筆，append 進 stock/data/market-history.json，
          # 隨時間自然累積——這是「大盤估值河流圖」要有歷史深度的唯一辦法，
          # 沒有捷徑。同一天重跑會覆蓋掉那天的舊值，不會產生重複。
          if [ ! -f stock/data/daily.json ] || [ ! -f stock/data/valuation.json ]; then
            echo "daily 或 valuation 快照都不存在，跳過（通常是第一次跑就失敗的情況）"
            exit 0
          fi

          JQ_MARKET=$(mktemp)
          cat > "$JQ_MARKET" <<'JQEOF'
          def numOrNull(s):
            if (s == null) then null
            elif (s | type) != "string" then null
            elif (s | test("^-?[0-9]+(\\.[0-9]+)?$")) then (s | tonumber)
            else null end;

          def median(a):
            (a | sort) as $s |
            ($s | length) as $n |
            if $n == 0 then null
            elif ($n % 2) == 1 then $s[($n - 1) / 2]
            else ($s[$n / 2 - 1] + $s[$n / 2]) / 2
            end;

          # 本益比 <= 0（虧損/無意義）、殖利率 <= 0（不配息）都排除，
          # 不然中位數會被這些「沒有估值意義」的公司拉偏。
          ($v[0]
            | map(
                numOrNull(.PEratio) as $pe
                | numOrNull(.DividendYield) as $y
                | select($pe != null and $pe > 0 and $y != null and $y > 0)
                | {pe: $pe, yield: $y}
              )
          ) as $rows
          | {
              date: $date,
              peMedian: (median($rows | map(.pe))),
              yieldMedian: (median($rows | map(.yield))),
              sampleSize: ($rows | length)
            }
          JQEOF

          # 日期用資料本身的交易日（daily.json 的 Date，民國轉西元），
          # 不用「現在跑的時間」——這樣即使某次是保留舊快照重算，日期
          # 也還是對應到那份資料實際的交易日，不會標錯。
          TRADE_DATE_ROC=$(jq -r '.[0].Date // empty' stock/data/daily.json)
          if [ -n "$TRADE_DATE_ROC" ] && [ "${#TRADE_DATE_ROC}" = "7" ]; then
            TRADE_DATE=$(jq -rn --arg d "$TRADE_DATE_ROC" \
              '($d[0:3] | tonumber + 1911 | tostring) + "-" + $d[3:5] + "-" + $d[5:7]')
          else
            TRADE_DATE=$(TZ=Asia/Taipei date +%Y-%m-%d)
          fi
          echo "交易日：$TRADE_DATE_ROC → $TRADE_DATE"

          # 用 --slurpfile 直接從檔案讀，不要把整包 JSON 塞進命令列參數——
          # valuation.json 有上千檔股票，塞進 argv 會撞到系統的參數長度上限
          # （實測「Argument list too long」）。--slurpfile 給的是
          # 「陣列包住檔案內容」，所以 jq 程式裡用 $v[0] 取出真正的陣列。
          ROW=$(jq -n --slurpfile v stock/data/valuation.json \
                  --arg date "$TRADE_DATE" -f "$JQ_MARKET")
          echo "今日估算：$ROW"

          HIST=stock/data/market-history.json
          [ -f "$HIST" ] || echo '[]' > "$HIST"
          jq --argjson row "$ROW" \
            '(map(select(.date != $row.date))) + [$row] | sort_by(.date)' \
            "$HIST" > "$HIST.tmp" && mv "$HIST.tmp" "$HIST"

          echo "累積天數：$(jq 'length' "$HIST")"

      - name: 累積個股價格歷史
        run: |
          # 「近一年報酬」證交所沒有現成端點可以直接查——openapi.twse.com.tw
          # 沒有參數可以指定查哪一年（FMNPTK_ALL 固定回今年至今），要湊出
          # 「跟一年前收盤價比」，唯一誠實的辦法就是像 market-history.json
          # 那樣自己逐日累積：每天把今天的收盤價存起來，滿一年後最舊的一筆
          # 自然就是「大約一年前」，不用等到、也不假裝現在就有。
          #
          # 為了不要讓檔案無限長大，只保留最近 400 天（留一點緩衝，確保
          # 滿一年時「最舊的一筆」不會因為假日/國定假日湊不滿 365 天）。
          if [ ! -f stock/data/daily.json ]; then
            echo "daily.json 不存在，跳過"
            exit 0
          fi

          TRADE_DATE_ROC=$(jq -r '.[0].Date // empty' stock/data/daily.json)
          if [ -n "$TRADE_DATE_ROC" ] && [ "${#TRADE_DATE_ROC}" = "7" ]; then
            TRADE_DATE=$(jq -rn --arg d "$TRADE_DATE_ROC" \
              '($d[0:3] | tonumber + 1911 | tostring) + "-" + $d[3:5] + "-" + $d[5:7]')
          else
            TRADE_DATE=$(TZ=Asia/Taipei date +%Y-%m-%d)
          fi
          CUTOFF_DATE=$(date -u -d "$TRADE_DATE - 400 days" +%Y-%m-%d 2>/dev/null \
            || date -u -j -v-400d -f "%Y-%m-%d" "$TRADE_DATE" +%Y-%m-%d)
          echo "交易日：$TRADE_DATE，只保留 $CUTOFF_DATE 之後的資料"

          JQ_PRICE=$(mktemp)
          cat > "$JQ_PRICE" <<'JQEOF'
          def numOrNull(s):
            if (s == null) then null
            elif (s | type) != "string" then null
            elif (s | test("^-?[0-9]+(\\.[0-9]+)?$")) then (s | tonumber)
            else null end;

          $h[0] as $h | $rows[0] as $rows |

          reduce $rows[] as $row (
            $h;
            ($row.Code) as $code |
            numOrNull($row.ClosingPrice) as $close |
            if $code == null or $code == "" or $close == null then .
            else
              (.[$code] // {d: [], c: []}) as $existing |
              ( [$existing.d, $existing.c] | transpose
                | map(select(.[0] != $date))
              ) as $kept |
              ( ($kept + [[$date, $close]])
                | sort_by(.[0])
                | map(select(.[0] >= $cutoff))
              ) as $final |
              .[$code] = { d: ($final | map(.[0])), c: ($final | map(.[1])) }
            end
          )
          JQEOF

          HIST=stock/data/price-history.json
          [ -f "$HIST" ] || echo '{}' > "$HIST"

          jq --slurpfile h "$HIST" --slurpfile rows stock/data/daily.json \
            --arg date "$TRADE_DATE" --arg cutoff "$CUTOFF_DATE" \
            -n -f "$JQ_PRICE" \
            > "$HIST.tmp" && mv "$HIST.tmp" "$HIST"

          echo "追蹤中的代號數：$(jq 'keys | length' "$HIST")"
          SAMPLE_CODE=$(jq -r 'keys[0] // empty' "$HIST")
          if [ -n "$SAMPLE_CODE" ]; then
            echo "以 $SAMPLE_CODE 為例，累積天數：$(jq --arg c "$SAMPLE_CODE" '.[$c].d | length' "$HIST")"
          fi

      - name: 累積個股估值歷史
        run: |
          # 個股版的河流圖——跟大盤估值概況（market-history.json）同一個
          # 精神，但這裡是「這檔本益比／殖利率跟它自己過去比」，不是跟
          # 全市場比。跟「累積個股價格歷史」那一步幾乎同一套邏輯，只是
          # 來源換成 valuation.json，而且一次存兩個數列（本益比＋殖利率）
          # 不是一個。
          if [ ! -f stock/data/daily.json ] || [ ! -f stock/data/valuation.json ]; then
            echo "daily.json 或 valuation.json 不存在，跳過"
            exit 0
          fi

          TRADE_DATE_ROC=$(jq -r '.[0].Date // empty' stock/data/daily.json)
          if [ -n "$TRADE_DATE_ROC" ] && [ "${#TRADE_DATE_ROC}" = "7" ]; then
            TRADE_DATE=$(jq -rn --arg d "$TRADE_DATE_ROC" \
              '($d[0:3] | tonumber + 1911 | tostring) + "-" + $d[3:5] + "-" + $d[5:7]')
          else
            TRADE_DATE=$(TZ=Asia/Taipei date +%Y-%m-%d)
          fi
          CUTOFF_DATE=$(date -u -d "$TRADE_DATE - 400 days" +%Y-%m-%d 2>/dev/null \
            || date -u -j -v-400d -f "%Y-%m-%d" "$TRADE_DATE" +%Y-%m-%d)
          echo "交易日：$TRADE_DATE，只保留 $CUTOFF_DATE 之後的資料"

          JQ_VAL=$(mktemp)
          cat > "$JQ_VAL" <<'JQEOF'
          def numOrNull(s):
            if (s == null) then null
            elif (s | type) != "string" then null
            elif (s | test("^-?[0-9]+(\\.[0-9]+)?$")) then (s | tonumber)
            else null end;

          $h[0] as $h | $rows[0] as $rows |

          reduce $rows[] as $row (
            $h;
            ($row.Code) as $code |
            numOrNull($row.PEratio) as $pe |
            numOrNull($row.DividendYield) as $y |
            if $code == null or $code == "" then .
            else
              (.[$code] // {d: [], pe: [], y: []}) as $existing |
              ( [$existing.d, $existing.pe, $existing.y] | transpose
                | map(select(.[0] != $date))
              ) as $kept |
              ( ($kept + [[$date, $pe, $y]])
                | sort_by(.[0])
                | map(select(.[0] >= $cutoff))
              ) as $final |
              .[$code] = { d: ($final | map(.[0])), pe: ($final | map(.[1])), y: ($final | map(.[2])) }
            end
          )
          JQEOF

          HIST=stock/data/valuation-history.json
          [ -f "$HIST" ] || echo '{}' > "$HIST"

          jq --slurpfile h "$HIST" --slurpfile rows stock/data/valuation.json \
            --arg date "$TRADE_DATE" --arg cutoff "$CUTOFF_DATE" \
            -n -f "$JQ_VAL" \
            > "$HIST.tmp" && mv "$HIST.tmp" "$HIST"

          echo "追蹤中的代號數：$(jq 'keys | length' "$HIST")"
          SAMPLE_CODE=$(jq -r 'keys[0] // empty' "$HIST")
          if [ -n "$SAMPLE_CODE" ]; then
            echo "以 $SAMPLE_CODE 為例，累積天數：$(jq --arg c "$SAMPLE_CODE" '.[$c].d | length' "$HIST")"
          fi

      - name: 有變更才 commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock/data
          if git diff --cached --quiet; then
            echo "資料沒有變化，不產生 commit"
            exit 0
          fi
          # 只列出檔案大小變化，不要把整包 JSON 塞進 commit message
          SUMMARY=$(cd stock/data && for f in *.json; do
            printf '%s (%s)\n' "$f" "$(jq 'if type=="array" then length else "meta" end' "$f" 2>/dev/null)"
          done)
          git commit -m "更新台股快照 $(TZ=Asia/Taipei date '+%Y-%m-%d')" -m "$SUMMARY"
          git push
